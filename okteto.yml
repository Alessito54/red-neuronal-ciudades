build:
  red-gps:
    context: .
    dockerfile: Dockerfile

deploy:
  commands:
    - name: Aplicar manifiestos
      command: kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml -f k8s/okteto/ingress.yaml
    - name: Usar la imagen construida por Okteto
      command: kubectl set image deployment/red-gps red-gps=${OKTETO_BUILD_RED_GPS_IMAGE}
    - name: Esperar a que el despliegue esté listo
      command: kubectl rollout status deployment/red-gps --timeout=180s
