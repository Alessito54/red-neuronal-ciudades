apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: red-gps
  annotations:
    dev.okteto.com/generate-host: "true"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: red-gps
                port:
                  number: 8080
