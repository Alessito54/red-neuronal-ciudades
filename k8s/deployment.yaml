apiVersion: apps/v1
kind: Deployment
metadata:
  name: red-gps
  labels:
    app: red-gps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: red-gps
  template:
    metadata:
      labels:
        app: red-gps
    spec:
      containers:
        - name: red-gps
          image: red-gps:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
